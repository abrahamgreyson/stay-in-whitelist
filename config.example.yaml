# 腾讯云
tencent:
  access_key: your_tencent_cloud_access_key
  secret_key: your_tencent_cloud_secret_key
  regions:
    - region: ap-bangkok
      rules:
        - sg: your_tencent_security_group_id
          allow:
            - port: 22
              desc: ssh
            - port: 32560
              desc: MySQL 5 只读节点
            - port: 32561
              desc: MySQL 8 只读节点
            - port: 32562
              desc: MySQL 5 主节点
            - port: 32563
              desc: MySQL 8 主节点
            - port: 32564
              desc: 越南 MySQL
            - port: 32565
              desc: 马来 MySQL
            - port: 32566
              desc: 斯里兰卡 MySQL
            - port: 32567
              desc: 预留
            - port: 32568
              desc: 预留

# Optional: security group rule description prefix (default: "from Wulihe")
# Change this for dev/prod isolation, e.g., "Abe" for testing
# Note: changing prefix means existing rules with old prefix become orphaned and must be cleaned up manually
# rule_prefix: "from Wulihe"

# Optional: static IPs to whitelist (bypasses auto-detection and scheduler entirely)
# When set, the tool does NOT detect your public IP, does NOT use IP caching,
# and does NOT start the periodic scheduler.
# Set to empty list ips: [] to clean up all prefix-matching rules.
# Combine with rule_prefix for namespace isolation, e.g.:
#   rule_prefix: "Abe"
#   ips: ["203.0.113.50", "198.51.100.10"]
# ips:
#   - 203.0.113.50
#   - 198.51.100.10

# ipinfo
# 请在 ipinfo.io 申请token
ipinfo:
  tokens:
    - your_ipinfo_token_a
    - your_ipinfo_token_b

# Optional: check interval in seconds (default: 600, minimum: 600)
# check_interval: 600

# Optional: file paths (defaults to same directory as config.yaml)
# paths:
#   ip_cache: /var/lib/stay-in-whitelist/ip_cache.txt
#   log_file: /var/log/stay-in-whitelist/stay_in_whitelist.log

# Optional: timeout settings (defaults shown, most users don't need to change)
# timeouts:
#   ip_detection:
#     connect: 3
#     read: 5
#   cloud_api:
#     connect: 3
#     read: 10
